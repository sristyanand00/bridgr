version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env.docker   # committed safe defaults — never contains secrets
    volumes:
      # Mount data directory so a full O*NET extract can be dropped in without rebuilding.
      # The sample CSV is baked into the image; this mount is optional.
      - ./backend/data:/app/backend/data:ro
    healthcheck:
      # python:3.11-slim does not include curl — use stdlib urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    command: sh -c "npm install && npm start"
    depends_on:
      backend:
        condition: service_healthy
