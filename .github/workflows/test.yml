name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Fast job: pure unit tests, no ML deps ───────────────────────────────
  # Runs on every push. Target: < 3 minutes.
  fast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        working-directory: bridgr/backend
        run: |
          pip install \
            fastapi==0.111.0 \
            uvicorn==0.29.0 \
            python-multipart==0.0.9 \
            pdfplumber==0.11.0 \
            pandas==2.2.2 \
            numpy==1.26.4 \
            python-dotenv==1.0.1 \
            pydantic-settings==2.2.1 \
            SQLAlchemy==2.0.30 \
            pytest==8.3.3 \
            pytest-cov==5.0.0 \
            httpx==0.27.0

      - name: Run fast tests (no ML)
        working-directory: bridgr/backend
        run: |
          python -m pytest tests/ \
            -m "not requires_ml" \
            --cov=core_ml \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: bridgr/backend/coverage.xml
          flags: backend-fast
        continue-on-error: true

  # ── Full job: all tests including ML deps ────────────────────────────────
  # Runs on PRs to main only to keep merge feedback fast.
  full:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('bridgr/backend/requirements.txt') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Cache spaCy model
        uses: actions/cache@v4
        with:
          path: ~/.cache/spacy
          key: spacy-en-core-web-sm-${{ runner.os }}

      - name: Install all dependencies
        working-directory: bridgr/backend
        run: pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run full test suite with coverage
        working-directory: bridgr/backend
        run: |
          python -m pytest tests/ \
            --cov=core_ml \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: bridgr/backend/coverage.xml
          flags: backend-full
        continue-on-error: true
